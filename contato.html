<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contato | Regali</title>
    <link rel="icon" href="./src/Imagens/LogoMarrom.jpg (1).png">
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <style src>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-image: url(./src/Imagens/background-menu.jpg);
            background-position: center;

            background-size: cover;
        }

        .header {
            overflow: hidden;
            margin: auto;
            width: 90%;
            padding: 15px;
            font-size: 25px;
        }

        #burguer {
            display: none;
        }

        .menu {
            display: flex;
            list-style: none;
            margin: 0 auto;
            padding: 30px;
            flex-wrap: wrap;
        }

        li {
            display: inline-block;
            margin: 15px auto;
        }


        nav li a:hover {

            color: #daa520;
        }

        .logo {

            margin-top: 150px;
            text-align: center;
        }

        #regalipng {
            width: 50%;
        }

        nav a {
            display: block;
            position: relative;
            color: #000000;
            font-size: 15px;
            padding: 8px 10px;
            margin: 0 5px;
            text-decoration: none;
        }

        a:before {
            content: '';
            position: absolute;
            left: 0;
            bottom: 0;
            width: 0;
            height: 3px;
            background-color: #daa520;
            transition: width .5s;
        }

        a:hover:before {
            width: 100%;
        }

        .card {
            background-color: rgb(255, 255, 255);
            display: flex;
            margin: 7% auto;
            height: 500px;
            width: 70%;
            border-radius: 15px;
            box-shadow: 20px 20px 0px #d9d9d9,
                -20px -20px 0px #ffffff;

        }

        .image {
            background-image: url(./src/Imagens/contato.jpg);
            background-size: cover;
            background-repeat: no-repeat;
            background-position: center;
            height: 450px;
            width: 40%;
            border-radius: 15px;
            margin: auto 30px;
        }

        label {
            display: block;
            margin: 5px 0 5px;
            font-weight: bold;
        }

        input,
        select,
        button {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            margin-bottom: 10px;
        }

        button {
            background-color: #d4af37;
            color: #fff;
            border: none;
            font-weight: bold;
            cursor: pointer;
        }

        button:disabled {
            background-color: #ccc;
            cursor: not-allowed;
        }

        .contactUs {
            display: flex;
            width: 50%;
            flex-direction: column;
        }

        #contate-nos {
            font-size: 50px;
            margin: auto;

        }

        .content {
            display: flex;
            border-width: 1px 0 0 1px;
            border-style: solid;
            border-color: #000000;
            margin-top: auto;
            margin-left: auto;


            height: 350px;
            width: 100%;


        }

        .enviaveis {
            width: 80%;
            flex-direction: column;
            padding: 15px;

        }



        .socialmidias {
            margin-top: 25px;
            width: 35px;
        }

        input {

            height: 30px;
            padding: 10px;
            margin-bottom: 30px;
            margin-top: 10px;
            border-width: 0 0 3px 0;
            border-style: solid;
            border-color: #000000;
        }

        .contato {
            display: none;
            padding: 15px;
            flex-direction: column;
            width: 50%;
            height: 30px;
            margin-right: auto;


        }

        h3 {
            margin-bottom: 15px;
            margin-top: 25px;
        }

        a {
            text-decoration: none;
            color: #000000;
            margin-bottom: 15px;
        }


        #button {
            margin: auto;
            border: 0 0 0 0;
            border-radius: 20px;
            background-color: #000000;
            color: white;
            width: 150px;
            height: 50px;
        }

        #button:hover {
            background-color: #ffffff;
            color: black;
            transition: ease-in 0.4s;
        }

        @media screen and (max-width:670px) {

            .container {

                width: 95%;
                justify-content: space-between;
                height: 100px;

            }

            .header {
                display: flex;
                flex-wrap: wrap;
                background-color: aliceblue;
                width: 100%;

            }

            a {
                font-size: 20px;
                font-weight: bold;
                color: black;
                margin: 10px;

            }

            #burguer {
                display: flex;

                cursor: pointer;
            }



            nav {
                width: 10%;
                height: 100vh;
                display: none;
            }

            img {
                width: 100px;

            }

            .setas {
                width: 40px;
                border: 1px solid black;
                border-radius: 50%;
                margin-top: 35px
            }


            .card {
                display: flex;
                width: 90%;
                height: 100%;

                flex-direction: column;
            }

            .image {
                width: 80%;
            }

            .contactUs {
                width: 70%;
                margin: auto;
            }


            .content {
                display: flex;
                flex-direction: column;
                margin: 0 auto;
                border: none;
            }

            input {
                padding: 15px;
            }

            .contato {
                display: flex;
                position: relative;
                width: 100%;
                height: 100%;
            }

            .socialmidias {
                flex-direction: inherit;
                justify-content: space-between;
                margin: 25px 15%;
            }
        }
    </style>
</head>


<body>
    <div class="header">
        <span class="material-symbols-outlined" id="burguer" onclick="clickMenu()">
            Menu
        </span>
        <nav id="menu">

            <ul class="menu">
                <li><a href="./index.html">Inicio</a></li>
                <li><a href="./historia.html">Historia</a></li>
                <li><a href="./unidade.html">Unidade</a></li>
                <li><a href="./menu.html">Menu</a></li>
                <li><a href="./delivery.html">Delivery</a></li>
                <li><a href="./contato.html">Reserva</a></li>
            </ul>


        </nav>




    </div>
    <div class="card">
        <div class="image"></div>
        <div class="contactUs">
            <h1 id="contate-nos">Reserve sua mesa</h1>
            <form id="reservaForm">
                <label for="pessoas">Quantas pessoas?</label>
                <input type="number" id="pessoas" name="pessoas" min="1" placeholder="Ex: 2" required>

                <label for="data">Data da reserva</label>
                <input type="date" id="data" name="data" required>

                <label for="horario">Horário</label>
                <select id="horario" name="horario" required>
                    <option value="">Selecione um horário</option>
                </select>

                <label for="telefone">Número de Celular:</label>
                <input type="tel" id="telefone" name="telefone" placeholder="(99) 99999-9999" required>


                <button type="submit" id="confirmar">Confirmar Reserva</button>
            </form>
        </div>
    </div>
  <script>
  // Máscara para telefone
  const telefoneInput = document.getElementById('telefone');
  telefoneInput.addEventListener('input', function () {
    let valor = telefoneInput.value.replace(/\D/g, '');
    if (valor.length > 11) valor = valor.slice(0, 11);

    if (valor.length >= 2 && valor.length <= 6)
      valor = `(${valor.slice(0, 2)}) ${valor.slice(2)}`;
    else if (valor.length > 6 && valor.length <= 10)
      valor = `(${valor.slice(0, 2)}) ${valor.slice(2, 6)}-${valor.slice(6)}`;
    else if (valor.length === 11)
      valor = `(${valor.slice(0, 2)}) ${valor.slice(2, 7)}-${valor.slice(7)}`;

    telefoneInput.value = valor;
  });

  // Horários por dia
  const dataInput = document.getElementById('data');
  const horarioSelect = document.getElementById('horario');

  const horarios = {
    almoco: gerarHorarios("11:45", "15:00", 15),
    jantar: gerarHorarios("18:00", "22:00", 15),
    jantarSexta: gerarHorarios("18:00", "23:00", 15),
    sabadoTarde: gerarHorarios("15:15", "17:45", 15),
    domingo: gerarHorarios("11:45", "17:00", 15)
  };

  dataInput.addEventListener('change', () => {
    const dataSelecionada = new Date(dataInput.value + 'T00:00:00');
    const diaSemana = dataSelecionada.getDay();

    let opcoes = [];

    if (diaSemana === 0) {
      opcoes = horarios.domingo;
    } else if (diaSemana >= 1 && diaSemana <= 4) {
      opcoes = [...horarios.almoco, ...horarios.jantar];
    } else if (diaSemana === 5) {
      opcoes = [...horarios.almoco, ...horarios.jantarSexta];
    } else if (diaSemana === 6) {
      opcoes = [...horarios.almoco, ...horarios.sabadoTarde, ...horarios.jantar];
    }

    preencherHorarios(opcoes);
  });

  function preencherHorarios(lista) {
    horarioSelect.innerHTML = '<option value="">Selecione um horário</option>';
    lista.forEach(h => {
      const opt = document.createElement('option');
      opt.value = h;
      opt.textContent = h;
      horarioSelect.appendChild(opt);
    });
  }

  function gerarHorarios(inicio, fim, intervaloMinutos) {
    const horarios = [];
    const [hInicio, mInicio] = inicio.split(':').map(Number);
    const [hFim, mFim] = fim.split(':').map(Number);

    let atual = new Date(0, 0, 0, hInicio, mInicio);
    const limite = new Date(0, 0, 0, hFim, mFim);

    while (atual <= limite) {
      const horas = atual.getHours().toString().padStart(2, '0');
      const minutos = atual.getMinutes().toString().padStart(2, '0');
      horarios.push(`${horas}:${minutos}`);
      atual.setMinutes(atual.getMinutes() + intervaloMinutos);
    }

    return horarios;
  }

  // Envio para Google Sheets via Google Apps Script Web App
  const form = document.getElementById('reservaForm');

  form.addEventListener('submit', async function (e) {
    e.preventDefault();

    const dados = {
      pessoas: form.pessoas.value,
      data: form.data.value,
      horario: form.horario.value,
      telefone: form.telefone.value
    };

    try {
      const resposta = await fetch("https://script.google.com/macros/s/AKfycbxe8QJwHIIScxzG8HBdzyi3XHWcbYV-EY3-dAl3ccvmA-o69FZSWxMMiHU9n49ffRiEdg/exec", {
        method: "POST",
        body: JSON.stringify(dados),
        headers: {
          "Content-Type": "application/json"
        }
      });

      if (resposta.ok) {
        alert("Reserva registrada com sucesso!");
        form.reset();
        horarioSelect.innerHTML = '<option value="">Selecione um horário</option>';
      } else {
        alert("Erro ao registrar reserva.");
      }
    } catch (erro) {
      console.error("Erro na requisição:", erro);
      alert("Erro de conexão com o servidor.");
    }
  });
</script>

</body>

</html>
